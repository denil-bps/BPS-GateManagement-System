<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <!-- Transparent / crisp white background -->
  <rect width="1000" height="200" fill="transparent" />

  <!-- EMBLEM SEAL GROUP (Left circular crest matching the uploaded image) -->
  <g transform="translate(110, 100)">
    <!-- Outer Sky Blue / Cyan Border -->
    <circle cx="0" cy="0" r="78" fill="#caf0f8" stroke="#0077b6" stroke-width="3" />
    <circle cx="0" cy="0" r="74" fill="#ffffff" stroke="#012758" stroke-width="1.5" />

    <!-- Top Devanagari Arc: श्रद्धा ज्ञान कर्म -->
    <path id="topDevanagariArc" d="M -54 -28 A 62 62 0 0 1 54 -28" fill="none" />
    <text font-family="'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="13" fill="#012758" letter-spacing="4">
      <textPath href="#topDevanagariArc" startOffset="50%" text-anchor="middle">
        श्रद्धा ज्ञान कर्म
      </textPath>
    </text>

    <!-- Inner Circle with Warm Fill -->
    <circle cx="0" cy="8" r="48" fill="#fffbe6" stroke="#012758" stroke-width="2" />

    <!-- Peacock Feathers on sides -->
    <circle cx="-38" cy="12" r="4" fill="#0096c7" stroke="#012758" stroke-width="1" />
    <circle cx="-38" cy="12" r="2" fill="#fda31b" />
    <circle cx="38" cy="12" r="4" fill="#0096c7" stroke="#012758" stroke-width="1" />
    <circle cx="38" cy="12" r="2" fill="#fda31b" />

    <!-- Flaming Torch of Knowledge -->
    <path d="M 0 -22 C -6 -12 -5 -6 0 0 C 5 -6 6 -12 0 -22 Z" fill="#e63946" stroke="#b7094c" stroke-width="1" />
    <path d="M 0 -17 C -3 -11 -3 -7 0 -3 C 3 -7 3 -11 0 -17 Z" fill="#fda31b" />
    <path d="M -3 -1 L 3 -1 L 2 10 L -2 10 Z" fill="#012758" />

    <!-- Student Figures (Reverence & Knowledge) -->
    <circle cx="16" cy="14" r="5" fill="#f8d7b3" stroke="#012758" stroke-width="1" />
    <path d="M 12 18 C 12 28 26 28 26 18 Z" fill="#f4a261" stroke="#012758" stroke-width="1" />
    <path d="M 12 28 C 8 36 28 36 28 28 Z" fill="#ffdd53" stroke="#012758" stroke-width="1" />

    <circle cx="-16" cy="12" r="4.5" fill="#f8d7b3" stroke="#012758" stroke-width="1" />
    <path d="M -21 16 C -21 26 -9 26 -9 16 Z" fill="#ffffff" stroke="#012758" stroke-width="1" />
    <path d="M -22 26 C -22 35 -8 35 -8 26 Z" fill="#ffdd53" stroke="#012758" stroke-width="1" />

    <!-- Upper Ribbon: VIDYA NIKETAN -->
    <path d="M -60 38 C -35 30 35 30 60 38 L 56 50 C 35 44 -35 44 -56 50 Z" fill="#caf0f8" stroke="#0077b6" stroke-width="1.5" />
    <path id="vidyaNiketanRibbonArc" d="M -54 44 C -30 38 30 38 54 44" fill="none" />
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="9" fill="#012758" letter-spacing="1.5">
      <textPath href="#vidyaNiketanRibbonArc" startOffset="50%" text-anchor="middle">
        VIDYA NIKETAN
      </textPath>
    </text>

    <!-- Lower Banner Ribbon: BIRLA PUBLIC SCHOOL, PILANI -->
    <path d="M -75 58 C -40 48 40 48 75 58 L 70 73 C 40 63 -40 63 -70 73 Z" fill="#ffffff" stroke="#012758" stroke-width="2" />
    <path d="M -75 58 L -86 64 L -73 71 Z" fill="#caf0f8" stroke="#012758" stroke-width="1.5" />
    <path d="M 75 58 L 86 64 L 73 71 Z" fill="#caf0f8" stroke="#012758" stroke-width="1.5" />
    <path id="birlaPublicSchoolArc" d="M -70 65 C -40 55 40 55 70 65" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="7.5" fill="#012758" letter-spacing="1">
      <textPath href="#birlaPublicSchoolArc" startOffset="50%" text-anchor="middle">
        BIRLA PUBLIC SCHOOL, PILANI
      </textPath>
    </text>
  </g>

  <!-- OFFICIAL TYPOGRAPHY BLOCK (Right side matching attached banner exactly) -->
  <g transform="translate(230, 0)">
    <!-- Line 1: VIDYA NIKETAN in Royal Blue Serif -->
    <text x="350" y="52" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="44" fill="#023e8a" letter-spacing="3">
      VIDYA NIKETAN
    </text>

    <!-- Line 2: BIRLA PUBLIC SCHOOL, PILANI in Prominent Royal Deep Blue -->
    <text x="350" y="106" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="46" fill="#012758" letter-spacing="1.5">
      BIRLA PUBLIC SCHOOL, PILANI
    </text>

    <!-- Line 3: A PRESTIGIOUS ENGLISH MEDIUM RESIDENTIAL SCHOOL (FOR BOYS) in Crimson Red -->
    <text x="350" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="21.5" fill="#e63946" letter-spacing="0.5">
      A PRESTIGIOUS ENGLISH MEDIUM RESIDENTIAL SCHOOL (FOR BOYS)
    </text>

    <!-- Line 4: Ranked Amongst Top 10 Boarding Schools For Boys in India in Deep Royal Blue -->
    <text x="350" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="21" fill="#023e8a" letter-spacing="0.2">
      Ranked Amongst Top 10 Boarding Schools For Boys in India
    </text>
  </g>
</svg>
